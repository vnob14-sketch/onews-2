<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ONEWS - Live Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">ONEWS</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="bencana.html" class="nav-link">Bencana</a>
                <a href="ekonomi.html" class="nav-link">Ekonomi</a>
                <a href="livestream.html" class="nav-link active">Live Stream</a>
                <a id="adminMenuLink" href="login.html" class="nav-link" style="border-left: 1px solid #475569; padding-left:16px;">Admin</a>
            </div>
            <div class="search-box"><input type="text" placeholder="Cari berita..." class="search-input" onkeydown="handleGlobalSearch(event)"></div>
        </div>
    </nav>
    <main>
        <div class="page-header">
            <h1 class="page-title">Live Stream</h1>
            <p class="page-desc">Transmisi penyiaran informasi digital secara waktu nyata melalui tautan langsung.</p>
        </div>
        <div id="newsGrid" class="news-grid"></div>
    </main>
    <script src="db.js"></script>
    <script>
        async function render() {
            const grid = document.getElementById("newsGrid");
            grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#94a3b8; font-style:italic;'>Memuat jadwal live...</p>";
            const fullData = await getNewsOnline();
            const data = fullData.filter(item => item.category === "livestream");
            grid.innerHTML = "";
            if(data.length === 0) { grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#94a3b8;font-style:italic;">Tidak ada jadwal siaran live online saat ini.</p>`; return; }
            data.forEach(news => {
                const card = document.createElement("div");
                card.className = "news-card";
                card.innerHTML = `<div class="video-stream-area" style="height:180px; margin-bottom:0; border:none; border-bottom:2px solid #10b981; font-size:14px;"><div class="live-dot"></div>SIARAN AKTIF</div><div class="news-body" style="padding:20px;"><div><span class="news-badge" style="background-color:#fee2e2; color:#dc2626;">LIVE STREAM</span><h3 class="news-title" style="margin-top:10px; font-size:18px;">${news.title}</h3></div><a href="${news.liveUrl || '#'}" target="_blank" class="read-more-btn" style="text-align:center; display:block; text-decoration:none; margin-top:16px;">Buka Tautan Siaran</a></div>`;
                grid.appendChild(card);
            });
        }
        render();
    </script>
</body>
</html>
